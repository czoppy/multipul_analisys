<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Thesis Reading Tracker</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"/>
  <style>
    :root {
      --todo-color: #6c757d;
      --read-color: #0d6efd;
      --done-color: #198754;
      --skip-color: #dc3545;
    }
    body { background: #f5f7fa; font-family: 'Segoe UI', system-ui, sans-serif; }
    .navbar { background: #1a1a2e !important; }
    .navbar-brand { font-weight: 700; letter-spacing: 1px; color: #e0e0e0 !important; }
    .stat-card { border: none; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,.07); }
    .stat-card .display-6 { font-weight: 700; }
    .badge-todo   { background: var(--todo-color); }
    .badge-read   { background: var(--read-color); }
    .badge-done   { background: var(--done-color); }
    .badge-skip   { background: var(--skip-color); }
    .status-badge { cursor: pointer; user-select: none; font-size: .78rem; padding: .35em .7em; }
    .table-card { border: none; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,.07); }
    .type-icon { font-size: 1.1rem; }
    td { vertical-align: middle; }
    .drop-zone {
      border: 2px dashed #adb5bd;
      border-radius: 10px;
      padding: 2rem;
      text-align: center;
      transition: .2s;
      cursor: pointer;
    }
    .drop-zone.dragover { border-color: #0d6efd; background: #e8f0ff; }
    .filter-btn.active { background: #1a1a2e; color: #fff; border-color: #1a1a2e; }
    .row-done td { opacity: .65; }
    .notes-cell { max-width: 200px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #searchInput { max-width: 260px; }
  </style>
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-dark px-4 py-3 mb-4">
  <span class="navbar-brand"><i class="bi bi-journal-bookmark-fill me-2"></i>Thesis Reading Tracker</span>
  <button class="btn btn-outline-light btn-sm" data-bs-toggle="modal" data-bs-target="#addModal">
    <i class="bi bi-plus-lg me-1"></i>Add Source
  </button>
</nav>

<div class="container-fluid px-4">

  <!-- Stats -->
  <div class="row g-3 mb-4" id="statsRow">
    <div class="col-6 col-md-3">
      <div class="card stat-card p-3 text-center">
        <div class="display-6" id="statTotal">0</div>
        <small class="text-muted">Total</small>
      </div>
    </div>
    <div class="col-6 col-md-3">
      <div class="card stat-card p-3 text-center">
        <div class="display-6 text-primary" id="statRead">0</div>
        <small class="text-muted">Reading</small>
      </div>
    </div>
    <div class="col-6 col-md-3">
      <div class="card stat-card p-3 text-center">
        <div class="display-6 text-success" id="statDone">0</div>
        <small class="text-muted">Done</small>
      </div>
    </div>
    <div class="col-6 col-md-3">
      <div class="card stat-card p-3 text-center">
        <div class="display-6 text-secondary" id="statTodo">0</div>
        <small class="text-muted">To Do</small>
      </div>
    </div>
  </div>

  <!-- Filters & Search -->
  <div class="d-flex flex-wrap gap-2 align-items-center mb-3">
    <div class="btn-group btn-group-sm" role="group">
      <button class="btn btn-outline-secondary filter-btn active" data-filter="all">All</button>
      <button class="btn btn-outline-secondary filter-btn" data-filter="todo">To Do</button>
      <button class="btn btn-outline-secondary filter-btn" data-filter="read">Reading</button>
      <button class="btn btn-outline-secondary filter-btn" data-filter="done">Done</button>
    </div>
    <div class="btn-group btn-group-sm ms-2" role="group">
      <button class="btn btn-outline-secondary filter-btn active" data-type="all">All Types</button>
      <button class="btn btn-outline-secondary filter-btn" data-type="paper"><i class="bi bi-file-text me-1"></i>Paper</button>
      <button class="btn btn-outline-secondary filter-btn" data-type="book"><i class="bi bi-book me-1"></i>Book</button>
      <button class="btn btn-outline-secondary filter-btn" data-type="online"><i class="bi bi-globe me-1"></i>Online</button>
    </div>
    <input type="text" id="searchInput" class="form-control form-control-sm ms-auto" placeholder="Search..."/>
  </div>

  <!-- Table -->
  <div class="card table-card mb-5">
    <div class="card-body p-0">
      <div class="table-responsive">
        <table class="table table-hover mb-0" id="itemsTable">
          <thead class="table-light">
            <tr>
              <th style="width:40px">#</th>
              <th style="width:30px"></th>
              <th>Title</th>
              <th>Author(s)</th>
              <th style="width:60px">Year</th>
              <th style="width:90px">Status</th>
              <th style="width:80px">Source</th>
              <th class="notes-cell">Notes</th>
              <th style="width:60px"></th>
            </tr>
          </thead>
          <tbody id="itemsBody">
            <tr id="emptyRow">
              <td colspan="9" class="text-center text-muted py-5">
                <i class="bi bi-inbox fs-2 d-block mb-2"></i>No sources yet — click <strong>Add Source</strong> to begin.
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<!-- Add Modal -->
<div class="modal fade" id="addModal" tabindex="-1">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title"><i class="bi bi-plus-circle me-2"></i>Add New Source</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <div class="mb-3">
          <label class="form-label fw-semibold">Type</label>
          <div class="btn-group w-100" role="group">
            <input type="radio" class="btn-check" name="typeRadio" id="typePaper" value="paper" checked/>
            <label class="btn btn-outline-primary" for="typePaper"><i class="bi bi-file-text me-1"></i>Paper / Article</label>
            <input type="radio" class="btn-check" name="typeRadio" id="typeBook" value="book"/>
            <label class="btn btn-outline-primary" for="typeBook"><i class="bi bi-book me-1"></i>Book / Chapter</label>
            <input type="radio" class="btn-check" name="typeRadio" id="typeOnline" value="online"/>
            <label class="btn btn-outline-primary" for="typeOnline"><i class="bi bi-globe me-1"></i>Online Resource</label>
          </div>
        </div>
        <div class="row g-3">
          <div class="col-12">
            <label class="form-label">Title <span class="text-danger">*</span></label>
            <input type="text" id="fTitle" class="form-control" placeholder="e.g. Attention Is All You Need"/>
          </div>
          <div class="col-md-8">
            <label class="form-label">Author(s)</label>
            <input type="text" id="fAuthors" class="form-control" placeholder="e.g. Vaswani et al."/>
          </div>
          <div class="col-md-4">
            <label class="form-label">Year</label>
            <input type="text" id="fYear" class="form-control" placeholder="e.g. 2017"/>
          </div>
          <div class="col-12">
            <label class="form-label">Link (URL)</label>
            <input type="url" id="fLink" class="form-control" placeholder="https://..."/>
          </div>
          <div class="col-12">
            <label class="form-label">Upload File (PDF, DOCX, etc.)</label>
            <div class="drop-zone" id="dropZone">
              <i class="bi bi-cloud-arrow-up fs-3 text-muted"></i>
              <p class="mb-1 text-muted">Drag & drop a file here, or click to browse</p>
              <small class="text-muted" id="dropZoneLabel">PDF, DOCX, TXT, EPUB — max 50 MB</small>
              <input type="file" id="fFile" class="d-none" accept=".pdf,.docx,.doc,.txt,.epub,.md"/>
            </div>
          </div>
          <div class="col-12">
            <label class="form-label">Notes</label>
            <textarea id="fNotes" class="form-control" rows="2" placeholder="Quick note..."></textarea>
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button class="btn btn-primary" id="saveBtn"><i class="bi bi-check-lg me-1"></i>Save</button>
      </div>
    </div>
  </div>
</div>

<!-- Edit Notes Modal -->
<div class="modal fade" id="editModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Edit Notes</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <textarea id="editNotes" class="form-control" rows="5"></textarea>
        <input type="hidden" id="editId"/>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button class="btn btn-primary" id="saveNotes">Save</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
const STATUS_CYCLE = ['todo', 'read', 'done', 'skip'];
const STATUS_LABEL = { todo: 'To Do', read: 'Reading', done: 'Done', skip: 'Skip' };
const TYPE_ICON    = { paper: 'bi-file-text', book: 'bi-book', online: 'bi-globe' };

let items = [];
let filterStatus = 'all';
let filterType   = 'all';
let searchQuery  = '';
let uploadedFile  = '';

// --- Data ---
async function loadItems() {
  const r = await fetch('/api/items');
  items = await r.json();
  render();
}

async function addItem(payload) {
  const r = await fetch('/api/items', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(payload) });
  const item = await r.json();
  items.push(item);
  render();
}

async function updateItem(id, payload) {
  await fetch(`/api/items/${id}`, { method: 'PUT', headers: {'Content-Type':'application/json'}, body: JSON.stringify(payload) });
  const item = items.find(i => i.id === id);
  if (item) Object.assign(item, payload);
  render();
}

async function deleteItem(id) {
  await fetch(`/api/items/${id}`, { method: 'DELETE' });
  items = items.filter(i => i.id !== id);
  render();
}

// --- Render ---
function render() {
  // Stats
  document.getElementById('statTotal').textContent = items.length;
  document.getElementById('statRead').textContent  = items.filter(i => i.status === 'read').length;
  document.getElementById('statDone').textContent  = items.filter(i => i.status === 'done').length;
  document.getElementById('statTodo').textContent  = items.filter(i => i.status === 'todo').length;

  const filtered = items.filter(i => {
    if (filterStatus !== 'all' && i.status !== filterStatus) return false;
    if (filterType   !== 'all' && i.type   !== filterType)   return false;
    if (searchQuery) {
      const q = searchQuery.toLowerCase();
      if (!`${i.title} ${i.authors} ${i.notes} ${i.year}`.toLowerCase().includes(q)) return false;
    }
    return true;
  });

  const tbody = document.getElementById('itemsBody');
  if (filtered.length === 0) {
    tbody.innerHTML = `<tr id="emptyRow"><td colspan="9" class="text-center text-muted py-5">
      <i class="bi bi-inbox fs-2 d-block mb-2"></i>${items.length === 0 ? 'No sources yet — click <strong>Add Source</strong> to begin.' : 'No results match your filters.'}</td></tr>`;
    return;
  }

  tbody.innerHTML = filtered.map((item, idx) => {
    const src = item.link
      ? `<a href="${item.link}" target="_blank" class="btn btn-sm btn-outline-secondary py-0"><i class="bi bi-link-45deg"></i></a>`
      : item.file
      ? `<a href="/papers/${item.file}" target="_blank" class="btn btn-sm btn-outline-secondary py-0"><i class="bi bi-file-earmark"></i></a>`
      : '—';
    return `
    <tr class="${item.status === 'done' ? 'row-done' : ''}" data-id="${item.id}">
      <td class="text-muted small">${idx + 1}</td>
      <td><i class="bi ${TYPE_ICON[item.type] || 'bi-file'} type-icon text-secondary"></i></td>
      <td><strong>${esc(item.title)}</strong></td>
      <td class="text-muted small">${esc(item.authors)}</td>
      <td class="text-muted small">${esc(item.year)}</td>
      <td>
        <span class="badge status-badge badge-${item.status}" onclick="cycleStatus('${item.id}')">
          ${STATUS_LABEL[item.status] || item.status}
        </span>
      </td>
      <td>${src}</td>
      <td class="notes-cell text-muted small" style="cursor:pointer" onclick="openEdit('${item.id}')" title="${esc(item.notes)}">
        ${item.notes ? esc(item.notes) : '<span class="text-muted">+note</span>'}
      </td>
      <td>
        <button class="btn btn-sm btn-link text-danger p-0" onclick="confirmDelete('${item.id}')" title="Delete">
          <i class="bi bi-trash"></i>
        </button>
      </td>
    </tr>`;
  }).join('');
}

function esc(s) {
  return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// --- Actions ---
function cycleStatus(id) {
  const item = items.find(i => i.id === id);
  if (!item) return;
  const next = STATUS_CYCLE[(STATUS_CYCLE.indexOf(item.status) + 1) % STATUS_CYCLE.length];
  updateItem(id, { status: next });
}

function confirmDelete(id) {
  if (confirm('Delete this source?')) deleteItem(id);
}

function openEdit(id) {
  const item = items.find(i => i.id === id);
  if (!item) return;
  document.getElementById('editNotes').value = item.notes || '';
  document.getElementById('editId').value = id;
  new bootstrap.Modal(document.getElementById('editModal')).show();
}

document.getElementById('saveNotes').addEventListener('click', () => {
  const id = document.getElementById('editId').value;
  const notes = document.getElementById('editNotes').value;
  updateItem(id, { notes });
  bootstrap.Modal.getInstance(document.getElementById('editModal')).hide();
});

// --- Filters ---
document.querySelectorAll('[data-filter]').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('[data-filter]').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    filterStatus = btn.dataset.filter;
    render();
  });
});
document.querySelectorAll('[data-type]').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('[data-type]').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    filterType = btn.dataset.type;
    render();
  });
});
document.getElementById('searchInput').addEventListener('input', e => {
  searchQuery = e.target.value;
  render();
});

// --- File Upload ---
const dropZone = document.getElementById('dropZone');
const fileInput = document.getElementById('fFile');

dropZone.addEventListener('click', () => fileInput.click());
dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('dragover'); });
dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
dropZone.addEventListener('drop', e => {
  e.preventDefault();
  dropZone.classList.remove('dragover');
  if (e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]);
});
fileInput.addEventListener('change', () => { if (fileInput.files[0]) handleFile(fileInput.files[0]); });

async function handleFile(file) {
  document.getElementById('dropZoneLabel').textContent = `Uploading: ${file.name}...`;
  const fd = new FormData();
  fd.append('file', file);
  const r = await fetch('/api/upload', { method: 'POST', body: fd });
  const data = await r.json();
  if (data.filename) {
    uploadedFile = data.filename;
    document.getElementById('dropZoneLabel').textContent = `✔ ${data.filename}`;
    // Auto-fill title if empty
    if (!document.getElementById('fTitle').value) {
      document.getElementById('fTitle').value = file.name.replace(/\.[^.]+$/, '').replace(/[-_]/g, ' ');
    }
  } else {
    document.getElementById('dropZoneLabel').textContent = 'Upload failed. Try again.';
  }
}

// --- Add Item ---
document.getElementById('saveBtn').addEventListener('click', async () => {
  const title = document.getElementById('fTitle').value.trim();
  if (!title) { document.getElementById('fTitle').classList.add('is-invalid'); return; }
  document.getElementById('fTitle').classList.remove('is-invalid');

  const type = document.querySelector('input[name="typeRadio"]:checked').value;
  await addItem({
    title,
    authors: document.getElementById('fAuthors').value,
    year:    document.getElementById('fYear').value,
    type,
    link:    document.getElementById('fLink').value,
    file:    uploadedFile,
    notes:   document.getElementById('fNotes').value,
  });

  // Reset form
  ['fTitle','fAuthors','fYear','fLink','fNotes'].forEach(id => document.getElementById(id).value = '');
  uploadedFile = '';
  document.getElementById('dropZoneLabel').textContent = 'PDF, DOCX, TXT, EPUB — max 50 MB';
  document.getElementById('typePaper').checked = true;
  bootstrap.Modal.getInstance(document.getElementById('addModal')).hide();
});

// --- Init ---
loadItems();
</script>
</body>
</html>
